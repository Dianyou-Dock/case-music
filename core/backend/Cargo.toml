[package]
name = "core"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = [] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-deep-link = "2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ncm-api = { path = "vendor/netease-cloud-music-api", package = "netease-cloud-music-api" }
#ncm-api = {path = "../../../netease-cloud-music-api", package = "netease-cloud-music-api"}
anyhow = { version = "1.0.93", features = ["backtrace"] }
reqwest = { version = "0.12.9", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
async-trait = "0.1.83"
tokio = { version = "1.35.0", features = ["full"] }
libc = "0.2"
rand = "0.8.5" # 确保版本是最新的
qrcode-generator = "5.0.0"
once_cell = { version = "1.20.2", features = ["default"] }
strum = "0.26.3"
strum_macros = "0.26.3"
dirs-next = "2.0.0"
cookie_store = "0.21.1"
openssl-sys = { version = "0.9", features = ["vendored"] }
err-logging = "0.1.1"
log = "0.4.22"
time = "0.3"
env_logger = "0.11.5"
base64 = "0.22"
sha2 = "0.10"
netease-qq-music-api = { git = "https://github.com/Dianyou-Dock/netease-qq-music-api", rev = "8613382" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", optional = true }
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef", default-features = false, optional = true }

[features]
default = ["native-webview"]
native-webview = ["tauri/wry", "dep:webkit2gtk"]
cef-webview = ["dep:tauri-runtime-cef", "tauri/custom-protocol"]
